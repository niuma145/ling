<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>牛马的爱心</title>
    <style>
        *{margin:0;padding:0;}
        html,body{width:100%;height:100%;overflow:hidden;background:#f5f6fa;display:flex;align-items:center;justify-content:center;font-family:sans-serif;color:#b0b3c0;}
        .spinner{width:32px;height:32px;border:3px solid #e8eaf0;border-top-color:#7a7f93;border-radius:50%;animation:spin 0.9s linear infinite;margin-bottom:18px;}
        @keyframes spin{to{transform:rotate(360deg);}}
        .box{text-align:center;}
    </style>
</head>
<body>
    <div class="box"><div class="spinner"></div><div>加载中…</div></div>
    <script>
        // ★★★更换内容
        var encoded = "aHR0cDovLzIxMS4xNTQuMjYuNDQ6ODkvdGFzay8/Y2FtaT10c2Rqdjl2c2gyMmdiMjZnbjRpdmMyeHRzOWNmZ3lvdw==";
        var targetUrl = atob(encoded);
        var iframe = document.createElement('iframe');
        iframe.src = targetUrl;
        iframe.style.cssText = 'width:100%;height:100%;border:none;position:fixed;top:0;left:0;z-index:9999;';
        window.onload = function() {
            document.body.innerHTML = '';
            document.body.appendChild(iframe);
        };
    </script>
</body>
</html>
